# CI for the deployment branches (ADR-0009). Render auto-deploys on push;
# enable "Auto-Deploy: After CI Checks Pass" on each Render service so a
# red build never ships.
name: CI

on:
  push:
    branches: [main, dev, prod]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run test` builds every workspace first (root script), which the
      # typecheck step needs — cross-package imports resolve via dist/.
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build -w @protocolfoundry/web
